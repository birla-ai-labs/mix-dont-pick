training_data_paths:
  - "${DATA_ROOT}/real_seed42"
probability:
  - 1.0
context_length: 512
prediction_length: 64
min_past: 60
max_steps: 50000
save_steps: 5000
log_steps: 500
per_device_train_batch_size: 96
learning_rate: 0.001
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 100000
gradient_accumulation_steps: 4
model_id: google/t5-efficient-mini
model_type: seq2seq
random_init: true
tie_embeddings: true
output_dir: ${STORAGE_ROOT}/output/chronos/real_reference_s42/
tf32: true
torch_compile: true
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096
lr_scheduler_type: linear
warmup_ratio: 0.0
dataloader_num_workers: 4
max_missing_prop: 0.9
use_eos_token: true
report_to: "wandb"
run_name: "chronos-real-reference-s42"
wandb_project: "geometry-of-pretraining"
seed: 42