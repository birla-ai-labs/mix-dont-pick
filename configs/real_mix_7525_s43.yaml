training_data_paths:
  - "${DATA_ROOT}/waveform_seed42"
  - "${DATA_ROOT}/sde_seed42"
  - "${DATA_ROOT}/kernelsynth_seed42"
  - "${DATA_ROOT}/chaotic_seed42"
  - "${DATA_ROOT}/tsi_seed42"
  - "${DATA_ROOT}/stepfunction_seed42"
  - "${DATA_ROOT}/timesynth_seed42"
  - "${DATA_ROOT}/fbm_seed42"
  - "${DATA_ROOT}/arima_seed42"
  - "${DATA_ROOT}/garch_seed42"
  - "${DATA_ROOT}/ets_seed42"
  - "${DATA_ROOT}/real_seed42"
probability:
  - 0.06818  # waveform
  - 0.06818  # sde
  - 0.06818  # kernelsynth
  - 0.06818  # chaotic
  - 0.06818  # tsi
  - 0.06818  # stepfunction
  - 0.06818  # timesynth
  - 0.06818  # fbm
  - 0.06818  # arima
  - 0.06818  # garch
  - 0.06820  # ets, slight rounding
  - 0.25000  # real
context_length: 512
prediction_length: 64
min_past: 60
max_steps: 50000
save_steps: 5000
log_steps: 500
per_device_train_batch_size: 96
learning_rate: 0.001
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 100000
gradient_accumulation_steps: 4
model_id: google/t5-efficient-mini
model_type: seq2seq
random_init: true
tie_embeddings: true
output_dir: ${STORAGE_ROOT}/output/chronos/mixed_real_7525_s43/
tf32: true
torch_compile: true
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096
lr_scheduler_type: linear
warmup_ratio: 0.0
dataloader_num_workers: 4
max_missing_prop: 0.9
use_eos_token: true
report_to: "wandb"
run_name: "chronos-mixed-real-7525-s43"
wandb_project: "geometry-of-pretraining"
seed: 43